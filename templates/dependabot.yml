# Shared Dependabot config template for zeroroot-ai repos.
#
# The rule (owner decision of 2026-10-05, D44):
#
#   - Dependabot opens grouped pull requests each week.
#   - A patch or minor update is in one group for each ecosystem. The sweep
#     scripts/dependabot-automerge.sh arms it, and it merges alone on a green
#     merge gate.
#   - A major update opens as its own pull request and waits for a person.
#     So no entry ignores major updates, and no group holds them.
#
# The .github/dependabot.yml of a repo copies the entries for the ecosystems
# that it has, and adapts only `directory`. scripts/check-dependabot-drift.py
# compares each repo with these rules each day. A difference needs an entry
# with a reason in repo-settings/dependabot-exceptions.json.

version: 2
updates:
  # Go modules: each repo with a go.mod. A repo whose module is not at the
  # root adapts the directory (adk: /gibson).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # The Conventional Commit prefix that pr-title-lint expects.
    commit-message:
      prefix: "chore(deps)"

  # npm: each repo with a package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions: each repo with a workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      # The sub-actions of codeql-action (init, analyze, upload-sarif) must
      # move together, also for a major update. A run with two versions of
      # them fails. This is the one group that holds each update type.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Docker base images: each repo with a Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      docker-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
