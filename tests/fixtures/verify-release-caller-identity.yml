# FIXTURE, never run. The release policy as it shipped before
# fix/verify-release-policy: every check binds the certificate SAN to the
# CALLER repo. The shared build signs with its own identity, so this can
# never pass. scripts/test-reusable-verify-release.sh must reject it.
name: Reusable verify-release
on:
  workflow_call:
    inputs:
      image_ref: {type: string, required: true}
      expected_subject_repo: {type: string, required: true}
      expected_commit_sha: {type: string, required: true}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify cosign signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ inputs.expected_subject_repo }}/.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"
      - name: Verify SLSA provenance attestation
        run: |
          set -euo pipefail
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "https://github.com/${{ inputs.expected_subject_repo }}/.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"
      - name: Extract SBOM attestation
        run: |
          set -euo pipefail
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "https://github.com/${{ inputs.expected_subject_repo }}/.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"
