# version-links.yaml — every cross-repo version link the org keeps by hand.
#
# Epic: zeroroot-ai/.github#20. One upstream version is copied into several
# places, and a README checklist was the only thing that kept the copies
# equal. This file names each link once. `version-drift.yml` reads it on a
# schedule, compares every value on `main`, checks the upstream release feed,
# and refreshes ONE tracker issue in this repo (see scripts/version-drift.py).
# `reusable-version-fanout.yml` reads the same entries to open the consumer PR
# when a source publishes.
#
# Schema (version 1):
#   links[].name        stable id, used in issue rows and fan-out inputs
#   links[].source      the ONE place a human edits
#     repo, file, key   key is `NAME` for format env (a `NAME=value` line) or a
#                       dotted path for format yaml
#     format            env | yaml
#   links[].consumers[] places that must equal the source; may be absent when
#                       the source repo derives every copy itself and the
#                       link exists only for the upstream watch
#     repo, file, key, format   as above
#     before            optional: compare only the part of the value before
#                       this string (image pins carry `@sha256:<digest>`)
#     image             required with `before`: the ghcr.io/zeroroot-ai image
#                       whose `<value>` tag the fan-out resolves to a digest
#     regenerate        optional list of shell commands the fan-out runs in
#                       the consumer clone after the rewrite (once per repo,
#                       deduplicated, in order). Every tracked file they
#                       change joins the fan-out commit; untracked output
#                       fails the run. For derived files the consumer's gate
#                       compares against the values (golden snapshots, the
#                       air-gap image list).
#     after             optional: compare only the part of the value after
#                       the last occurrence of this string (an inline image
#                       reference `registry/name:tag` carries the tag after
#                       the last `:`). Drift-only: the fan-out refuses to
#                       rewrite an `after` consumer, a human edits it.
#   links[].upstream    optional: the upstream release feed to watch
#     repo              GitHub owner/name; the newest non-prerelease,
#                       non-draft release by semver is "newest". The compare
#                       runs at the precision of the source value: a source
#                       `3.6` is in sync with a newest `v3.6.4` and behind a
#                       `v3.7.0` (floating minor tags track patches upstream).
#   links[].subchart    optional: the Helm dependency this value overrides
#     repo, file        the umbrella Chart.yaml
#     name              the dependency's alias or name in that file
#     tool              optional, true when the override is a tool image the
#                       subchart runs, not the subchart's own app; the row
#                       then records the appVersion without comparing
#                       The detector reads the dependency's pinned version and
#                       repository, fetches `<repository>/index.yaml`, and
#                       records that chart version's appVersion, the version
#                       the chart was tested with. Informational, never drift.
#
# Every value is read from the repo's default branch. A link is IN SYNC when
# every consumer equals the source and no upstream release is newer than the
# source. A link needs a source and at least one of consumers, upstream or
# subchart.
version: 1
links:
  - name: zitadel
    # The fork leads (owner decision 2026-09-07): the patch set is re-resolved
    # in zitadel-login, so UPSTREAM_REF is the one place a human edits. The
    # chart's server tag and its login image pin follow.
    source:
      repo: zeroroot-ai/zitadel-login
      file: UPSTREAM_REF
      key: TAG
      format: env
    consumers:
      - repo: zeroroot-ai/charts
        file: helm/gibson/values.yaml
        key: zitadel.image.tag
        format: yaml
      - repo: zeroroot-ai/charts
        file: helm/gibson/values.yaml
        key: zitadel.login.image.tag
        format: yaml
        before: "@"
        image: zitadel-login
        regenerate:
          - ./scripts/golden.sh update
          - ./bigbang/images/generate-image-list.py
    upstream:
      repo: zitadel/zitadel
    subchart:
      repo: zeroroot-ai/charts
      file: helm/gibson/Chart.yaml
      name: zitadel

  # ---- charts: hand-overridden subchart image tags (charts#14) -------------
  # Each entry below is an image tag in the umbrella values that overrides a
  # subchart's own image. The override in charts IS the source: nothing else
  # carries the version, so the link exists to record the subchart's tested
  # appVersion and to watch upstream. No override is changed by declaring it.
  - name: openfga
    source:
      repo: zeroroot-ai/charts
      file: helm/gibson/values.yaml
      key: openfga.image.tag
      format: yaml
    upstream:
      repo: openfga/openfga
    subchart:
      repo: zeroroot-ai/charts
      file: helm/gibson/Chart.yaml
      name: openfga

  - name: alpine-k8s
    # The alpine-k8s tool image (kubectl + sh) every first-party Job, init
    # container, gate and helm-test probe renders through `gibson.toolImage`
    # (charts `global.toolImage`, the source). Two more copies live in the
    # same values file and must equal it: the zitadel subchart's own kubectl
    # tool image, which the fan-out rewrites, and the wait-for-system-key
    # init container, a plain string the upstream zitadel chart takes
    # verbatim, so it is drift-only. No upstream feed: the alpine/k8s image
    # tracks Kubernetes minors, and the right version is the cluster's, not
    # the newest. Add a new tag to mirror-list.yaml before moving it.
    source:
      repo: zeroroot-ai/charts
      file: helm/gibson/values.yaml
      key: global.toolImage.tag
      format: yaml
    consumers:
      - repo: zeroroot-ai/charts
        file: helm/gibson/values.yaml
        key: zitadel.tools.kubectl.image.tag
        format: yaml
        regenerate:
          - ./scripts/golden.sh update
          - ./bigbang/images/generate-image-list.py
      - repo: zeroroot-ai/charts
        file: helm/gibson/values.yaml
        key: zitadel.initContainers.0.image
        format: yaml
        after: ":"
    subchart:
      repo: zeroroot-ai/charts
      file: helm/gibson/Chart.yaml
      name: zitadel
      tool: true

  - name: wait4x
    # The init-container tool image of the zitadel subchart's login
    # Deployment. `3.6` is a floating minor tag on purpose: the mirror
    # refresh picks up patches. The upstream compare runs at minor precision.
    source:
      repo: zeroroot-ai/charts
      file: helm/gibson/values.yaml
      key: zitadel.tools.wait4x.image.tag
      format: yaml
    upstream:
      repo: wait4x/wait4x
    subchart:
      repo: zeroroot-ai/charts
      file: helm/gibson/Chart.yaml
      name: zitadel
      tool: true

  - name: kata
    # setec pins the kata-containers release once, in kata.env (setec#26).
    # The installer image build, the dev k3s script and the packer AMI bake
    # all read that file, and scripts/check-kata-pin.sh in setec fails when
    # any of them names a literal. So the link has no consumers to compare;
    # it is declared for the upstream watch: a new kata release shows up
    # here, not in a Trivy digest months later.
    source:
      repo: zeroroot-ai/setec
      file: kata.env
      key: KATA_VERSION
      format: env
    upstream:
      repo: kata-containers/kata-containers
