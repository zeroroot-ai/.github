name: link-check
description: Check a repository's Markdown for what a public reader cannot follow

# WHY THIS IS AN ACTION AND NOT A STEP IN THE REUSABLE WORKFLOW
#
# Two callers run the same check: .github/workflows/link-check.yml, which every
# repo in the org calls, and the fixture job in .github/workflows/tree-guards.yml,
# which proves the check can fail. One invocation, in one file, means the
# fixture job exercises what the org runs rather than a copy of it.
#
# The action also carries the org policy file, lychee.toml, so a caller repo
# needs no configuration of its own.
#
# THREE CHECKS, ONE ACTION
#
# lychee checks links. Two scripts beside it check what lychee cannot see:
# check-org-refs.sh fails a PUBLIC repository whose Markdown links or refers
# into a private or deleted repository, or cites an issue number from before
# the 2026-09-05 history reset; check-spelling.sh fails British spelling in
# prose (AGENTS.md § 12). Both prove they can fail before every scan, and the
# fixture job in tree-guards.yml proves each one on a fixture file.

inputs:
  repo-root:
    description: "Path to the calling repository's checkout, the tree to check"
    required: true
  paths:
    description: >-
      Space-separated list of directories or Markdown files to check, relative
      to repo-root. A directory contributes its whole `**/*.md` and `**/*.mdx`
      tree. Default: the whole repository.
    required: false
    default: "."
  config:
    description: >-
      Caller configuration file, relative to repo-root, applied after the org
      policy. A missing file is not an error. Set it to an empty string to run
      the org policy alone, which is what the fixture job does.
    required: false
    default: ".lychee.toml"
  fail:
    description: >-
      Fail the action when any check reports a problem. The fixture job sets
      this to false and asserts on exit_code instead.
    required: false
    default: "true"
  visibility:
    description: >-
      The calling repository's visibility for check-org-refs.sh: public,
      private or auto. Auto asks the API. The fixture job sets public so the
      fixtures fail the way a public repository would.
    required: false
    default: "auto"

outputs:
  exit_code:
    description: >-
      0 when every check passed. Otherwise the first non-zero exit code, in
      the order lychee, org-refs, spelling.
    value: ${{ steps.result.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Prove the guards can fail
      shell: bash
      run: |
        set -euo pipefail
        chmod +x "${{ github.action_path }}"/check-org-refs.sh "${{ github.action_path }}"/check-spelling.sh
        "${{ github.action_path }}/check-org-refs.sh" --selftest
        "${{ github.action_path }}/check-org-refs.sh" --check-policy
        "${{ github.action_path }}/check-spelling.sh" --selftest

    - name: Build the lychee arguments
      id: args
      shell: bash
      env:
        REPO_ROOT: ${{ inputs.repo-root }}
        PATHS: ${{ inputs.paths }}
        CALLER_CONFIG: ${{ inputs.config }}
        ORG_CONFIG: ${{ github.action_path }}/lychee.toml
      run: |
        set -euo pipefail

        # lychee-action runs `eval lychee ... $ARGS`, so every path is quoted
        # here and the quotes survive to the command line.
        args="--no-progress --max-concurrency 8"

        # Relative links and anchors are the drift class that a link checker
        # catches and nothing else does. --include-fragments resolves an
        # anchor against the heading it points at, in the file it points at.
        args="$args --include-fragments"

        args="$args --config '${ORG_CONFIG}'"
        if [ -n "$CALLER_CONFIG" ] && [ -f "${REPO_ROOT}/${CALLER_CONFIG}" ]; then
          args="$args --config '${CALLER_CONFIG}'"
          echo "::notice::applying the caller configuration ${CALLER_CONFIG} on top of the org policy"
        fi

        args="$args --"
        for p in $PATHS; do
          case "$p" in
            *.md|*.mdx) args="$args '${p}'" ;;
            */)         args="$args '${p}**/*.md' '${p}**/*.mdx'" ;;
            *)          args="$args '${p}/**/*.md' '${p}/**/*.mdx'" ;;
          esac
        done

        echo "args=$args" >>"$GITHUB_OUTPUT"
        echo "lychee $args"

    - name: Check the links
      id: lychee
      # v2.9.0 is the first release that finds the binary when the release
      # tarball carries it inside a directory, which every lychee release
      # after v0.23.0 does. v2.8.0 installs nothing and fails with
      # "install: cannot stat .../lychee-download/lychee".
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        workingDirectory: ${{ inputs.repo-root }}
        args: ${{ steps.args.outputs.args }}
        # The action decides below whether to fail, so every check gets to
        # run and report before the step goes red.
        fail: false
        # A glob that matches no Markdown at all is a configuration error, not
        # a clean repository.
        failIfEmpty: true
        # Pinned so the workstation and the runner check the same way.
        lycheeVersion: v0.24.2
        # lychee resolves github.com links through the API when a token is
        # present, which is what keeps the anonymous rate limit out of CI.
        token: ${{ github.token }}

    - name: References a public reader cannot follow
      id: org_refs
      shell: bash
      env:
        REPO_ROOT: ${{ inputs.repo-root }}
        PATHS: ${{ inputs.paths }}
        CALLER_REPO: ${{ github.repository }}
        CALLER_VISIBILITY: ${{ inputs.visibility }}
        GH_TOKEN: ${{ github.token }}
      # The composite shell runs with -e, so the exit code is captured on the
      # same line and the step itself never fails: the combining step decides.
      run: |
        rc=0
        "${{ github.action_path }}/check-org-refs.sh" || rc=$?
        echo "exit_code=${rc}" >>"$GITHUB_OUTPUT"

    - name: American spelling in prose
      id: spelling
      shell: bash
      env:
        REPO_ROOT: ${{ inputs.repo-root }}
        PATHS: ${{ inputs.paths }}
      # The composite shell runs with -e, so the exit code is captured on the
      # same line and the step itself never fails: the combining step decides.
      run: |
        rc=0
        "${{ github.action_path }}/check-spelling.sh" || rc=$?
        echo "exit_code=${rc}" >>"$GITHUB_OUTPUT"

    - name: Combine the results
      id: result
      shell: bash
      env:
        LYCHEE: ${{ steps.lychee.outputs.exit_code }}
        ORG_REFS: ${{ steps.org_refs.outputs.exit_code }}
        SPELLING: ${{ steps.spelling.outputs.exit_code }}
        FAIL: ${{ inputs.fail }}
      run: |
        set -euo pipefail
        code=0
        for c in "${LYCHEE:-0}" "${ORG_REFS:-0}" "${SPELLING:-0}"; do
          if [ "$c" != "0" ]; then code="$c"; break; fi
        done
        echo "exit_code=${code}" >>"$GITHUB_OUTPUT"
        echo "lychee=${LYCHEE:-0} org-refs=${ORG_REFS:-0} spelling=${SPELLING:-0}"
        if [ "$FAIL" = "true" ] && [ "$code" != "0" ]; then
          echo "::error::link-check: a check failed, read the step output above"
          exit "$code"
        fi
