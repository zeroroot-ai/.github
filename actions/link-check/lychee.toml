# The org link-check policy. Every call applies this file first.
#
# A caller repository may add `.lychee.toml` at its own root. lychee merges
# configuration files given with repeated `--config` flags, and list keys
# append, so a caller file ADDS to this policy and never replaces it. Put
# repo-specific exclusions there, never here.
#
# Read actions/link-check/action.yml for the flags that are not settable from
# a configuration file.

# Fail on any 4xx or 5xx except these three.
#   429  the host is rate-limiting the runner, which says nothing about the link
#   403  what github.com returns to an unauthenticated caller it is throttling.
#        lychee cannot scope an accepted code to one host, so 403 is accepted
#        everywhere. The action passes GITHUB_TOKEN, so real github.com links
#        are resolved through the API rather than by an anonymous fetch.
#   503  the server is up and declining to serve right now, which is the same
#        statement about the link as 429: none. gibson-executor's main went red
#        on a single
#          [503] https://github.com/zeroroot-ai/.github/blob/main/AGENTS.md
#        a URL that plainly exists. max_retries below had already spent its
#        three attempts inside the window.
#
#        This does not hide a dead host. A host that is gone fails DNS
#        resolution or refuses the connection; returning 503 requires a live
#        server. A link that is actually dead returns 404 or 410, and both
#        still fail.
#
#        It matters more than a one-off annoyance because `link-check` is a
#        REQUIRED status check in every repo's ruleset: a GitHub blip during a
#        pull-request run does not just add noise, it blocks the merge.
accept = ["200..=299", "403", "429", "503"]

# A flaky host gets three chances before it fails a pull request. Three attempts
# a second apart ride out very little, which is why the 503 accept above is the
# actual fix rather than a larger retry budget: `retry_wait_time` is not a key I
# could confirm lychee v0.24.2 reads from this file, and a setting that may be
# silently ignored is worse than no setting, because it reads as protection.
max_retries = 3

exclude_loopback = true

exclude = [
  "^mailto:",
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "example\\.com",
  "example\\.org",
  "\\.local(?:[:/]|$)",
  # Private repositories in this org. GITHUB_TOKEN is scoped to the calling
  # repository, so the API returns 404 for every one of these and the link
  # would fail for a reason that has nothing to do with the link. A PUBLIC
  # repository must still not link to them: check-org-refs.sh fails that
  # case. This alternation must name exactly the repositories in
  # data/not-distributed.txt; `check-org-refs.sh --check-policy` asserts it.
  "github\\.com/zeroroot-ai/(?:hosted|billing|www|testharness|codeql-go-queries|codeql-ts-queries)",
]

exclude_path = [
  "node_modules/",
  "\\.worktrees/",
  "/dist/",
  "\\.next/",
  "vendor/",
  # release-please owns the changelog and rewrites it on every release. Its
  # links point at pull requests, and the pre-reset ones no longer resolve.
  "CHANGELOG\\.md$",
]
