name: flake-quarantine
description: Wraps a test command with retry-3x logic + emits flake events

inputs:
  cmd:
    description: "The test command to wrap"
    required: true
  max-attempts:
    description: "Maximum attempts before declaring failure"
    required: false
    default: "3"
  flake-log-path:
    description: "Where to write flake event log (uploaded as artifact)"
    required: false
    default: "flake.json"
  artifact-name:
    description: >-
      Artifact name for the flake log. Must start with "flake-log" (the
      org aggregator downloads by that prefix — flake-report.yml) and must
      be unique within a workflow run: artifact names collide across matrix
      legs and across multiple wrapped commands in one job, so such callers
      MUST override this with a distinguishing suffix (e.g. append the
      matrix leg value). NB do not write a literal expression example here;
      the runner template-parses this description (see git history).
    required: false
    default: "flake-log-${{ github.job }}"

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -uo pipefail
        ATTEMPT=1
        MAX=${{ inputs.max-attempts }}
        LOG=${{ inputs.flake-log-path }}
        SUCCESS=0
        FAILURES=()

        while [ $ATTEMPT -le $MAX ]; do
          echo "::group::attempt $ATTEMPT of $MAX"
          if bash -c "${{ inputs.cmd }}"; then
            SUCCESS=$ATTEMPT
            echo "::endgroup::"
            break
          fi
          FAILURES+=("$ATTEMPT")
          echo "::endgroup::"
          echo "::warning::attempt $ATTEMPT failed"
          ATTEMPT=$((ATTEMPT + 1))
        done

        # Emit flake event log (machine-readable).
        # Avoid heredoc so YAML doesn't get confused by column-0 terminators.
        FAILED_LIST=""
        if [ ${#FAILURES[@]} -gt 0 ]; then
          FAILED_LIST=$(IFS=,; echo "${FAILURES[*]}")
        fi
        IS_FLAKE="false"
        if [ $SUCCESS -gt 1 ]; then IS_FLAKE="true"; fi
        printf '{"repo":"%s","ref":"%s","sha":"%s","cmd":"%s","max_attempts":%s,"success_on_attempt":%s,"failed_attempts":[%s],"is_flake":%s}\n' \
          "${{ github.repository }}" \
          "${{ github.ref }}" \
          "${{ github.sha }}" \
          "${{ inputs.cmd }}" \
          "$MAX" \
          "$SUCCESS" \
          "$FAILED_LIST" \
          "$IS_FLAKE" \
          > "$LOG"

        if [ $SUCCESS -eq 0 ]; then
          echo "::error::test failed after $MAX attempts"
          exit 1
        fi
        if [ $SUCCESS -gt 1 ]; then
          echo "::warning::test passed but flaked — succeeded on attempt $SUCCESS"
        fi

    # Upload the flake event log so the org aggregator
    # (zeroroot-ai/.github .github/workflows/flake-report.yml) can collect
    # it. This step was missing originally, which made the weekly flake
    # report empty by construction: the aggregator downloaded an artifact
    # nobody ever uploaded (.github#241). `always()` so the log survives a
    # hard failure (SUCCESS=0) — a test that failed all attempts is still
    # signal for the report.
    - if: always()
      uses: actions/upload-artifact@v7.0.1 # pin: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.flake-log-path }}
        if-no-files-found: warn
        retention-days: 14
