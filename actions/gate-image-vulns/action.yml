name: gate-image-vulns
description: Refuse to push an image that has a fixable HIGH or CRITICAL vulnerability

# WHY THIS IS AN ACTION AND NOT A `run:` STEP
#
# A reusable workflow's `run:` steps execute in the CALLER's checkout, so a
# script kept under this repo's scripts/ is simply not on disk when the step
# runs. An action ships its own files. This is the third time that has bitten
# this workflow; the first two were spdx-from-license and verify-image-license.
#
# scripts/test-gate-image-vulns.sh holds the fixtures and runs offline against
# crafted Trivy JSON — no docker, no network. That is why the DECISION lives in
# gate-image-vulns.sh and the govulncheck run lives in
# collect-reachability.sh: the half that decides is fully testable offline, and
# the half that needs docker and a vulnerability database is a thin producer of
# the evidence file it reads.

inputs:
  report:
    description: "Trivy JSON report to judge."
    required: true
  severities:
    description: "Comma-separated severities that block. Default HIGH,CRITICAL."
    required: false
    default: "HIGH,CRITICAL"
  vendored-binaries:
    description: >
      Newline-separated paths, inside the image, of binaries this repo does NOT
      compile. For these the gate asks REACHABILITY instead of staleness: it runs
      govulncheck -mode=binary and blocks only on a finding whose affected symbol
      is actually present.

      This is not an allowlist. There are no per-CVE entries, nothing to expire
      and nothing to re-pin, and a reachable finding still blocks. It exists
      because a Go stdlib finding on a binary we cannot rebuild is a version
      comparison with no remedy: gVisor ships every artifact built with the Go its
      own go.mod names, so eleven fixable HIGH findings arrived that setec could
      not act on in any way. A gate with no remedy is a wall.

      An analysis that does not run BLOCKS. Leave this empty and the gate behaves
      exactly as it did before.
    required: false
    default: ""
  image:
    description: >
      The image ref to extract vendored binaries from. Required when
      vendored-binaries is set; the image must already be loaded locally, which
      it is at the point the scan runs.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VENDORED: ${{ inputs.vendored-binaries }}
        IMAGE: ${{ inputs.image }}
        REPORT: ${{ inputs.report }}
        SEVERITIES: ${{ inputs.severities }}
      run: |
        set -euo pipefail
        reachdir=""
        # Read the paths from the environment, not from an interpolated argv: a
        # path with a space would otherwise split into two arguments.
        mapfile -t paths < <(printf '%s\n' "${VENDORED}" | sed '/^[[:space:]]*$/d')
        if [ "${#paths[@]}" -gt 0 ]; then
          if [ -z "${IMAGE}" ]; then
            echo "::error::vendored-binaries is set but image is empty; the gate cannot extract a binary it was not told where to find"
            exit 1
          fi
          reachdir="$(mktemp -d)"
          bash "${{ github.action_path }}/collect-reachability.sh" \
            "${IMAGE}" "$reachdir" "${paths[@]}"
        fi
        # The verdict has to be VISIBLE even where it is not fatal.
        #
        # The caller wraps this step in
        #   continue-on-error: ${{ github.event_name == 'pull_request' }}
        # so on a PR the gate runs, prints BLOCKED, and the job goes green anyway.
        # The result is a PR that passes having said no, and the first push to the
        # default branch then fails on a verdict the PR already knew. docs-site,
        # dashboard and integrations all hit that on 2026-10-02, and so did setec:
        # its installer gate printed BLOCKED on the PR, merged green, and broke
        # main.
        #
        # So the exit code is captured rather than allowed to end the step, and a
        # blocking verdict is written to the run's step summary and raised as a
        # workflow annotation. Annotations and the summary survive
        # continue-on-error, so the author sees the verdict wherever this runs.
        # The original exit code is then re-raised unchanged: whether CI goes red
        # stays the caller's decision, which is not this action's to make.
        out="$(mktemp)"
        rc=0
        bash "${{ github.action_path }}/gate-image-vulns.sh" \
          "${REPORT}" "${SEVERITIES}" "$reachdir" >"$out" 2>&1 || rc=$?
        cat "$out"

        if [ "$rc" -ne 0 ]; then
          {
            echo "### Image vulnerability gate: BLOCKED"
            echo ""
            echo "This image would NOT be pushed. On a pull request the step is"
            echo "wrapped in \`continue-on-error\`, so the job may still report"
            echo "green — the verdict below is what the default branch will do."
            echo ""
            echo '```'
            cat "$out"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          # One annotation carrying the first blocking line, so the verdict is
          # visible in the Checks view and not only inside a step's log.
          first="$(grep -m1 -E '^(BLOCKED|  (CRITICAL|HIGH|MEDIUM|LOW))' "$out" | sed 's/[[:space:]]\+/ /g; s/^ //')"
          echo "::error title=Image vulnerability gate blocked this image::${first:-see the job summary for the findings}"
        fi
        rm -f "$out"
        exit "$rc"
