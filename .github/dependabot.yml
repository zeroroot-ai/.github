version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    # github/codeql-action is one action with several sub-actions (init,
    # autobuild, analyze, upload-sarif). Dependabot sees each sub-action as
    # its own dependency and bumps them in separate PRs. One of those PRs
    # merged alone leaves init and analyze at different versions, and the
    # CodeQL run fails with "Loaded a configuration file for version X, but
    # running version Y" (.github#121). Group them so they bump together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # A patch or a minor update of each other action is in one pull request,
      # and the sweep arms it. A major update opens alone and waits for a
      # person (templates/dependabot.yml).
      actions-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
