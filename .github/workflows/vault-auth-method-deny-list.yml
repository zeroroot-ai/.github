# Reusable workflow that enforces ADR-0009's deny-list.
#
# ADR-0009 (zeroroot-ai/docs#33, amended docs#34) establishes that every
# platform service-to-service auth uses JWT + SPIFFE. The "### Deny-list"
# section enumerates literal tokens that MUST NOT appear in any consumer
# repo's source tree. This workflow scans the calling repo for those
# tokens and fails the PR on any new (non-allowlisted) occurrence.
#
# Source of truth for the deny-list:
#   the local docs repo → adr/0009-jwt-spiffe-everywhere.md
#
# Parse-stable vendored snapshot in this repo:
#   data/adr-0009-deny-list.md
#
# The workflow reads the deny-list from the vendored snapshot (not the
# docs repo directly), because zeroroot-ai/docs is private and not every
# consumer repo has DOCS_REPO_READ_TOKEN. The vendored file is kept in
# lockstep with the ADR via the sync contract documented at the top of
# `data/adr-0009-deny-list.md`.
#
# Called by per-repo workflows via:
#   uses: zeroroot-ai/.github/.github/workflows/vault-auth-method-deny-list.yml@main
#
# Required check name: vault-auth-method-deny-list
#
# Per-repo opt-in: each consumer repo may carry an allowlist file at
# .github/.vault-auth-deny-list-allowlist.json. Each entry is a JSON
# object of {file, line, token, reason}. The list is monotonic-shrink:
# any entry whose source line no longer matches the token is treated as
# stale and fails the run (with a hint to remove it). New violations
# are never auto-allowlisted; reviewers must hand-edit the JSON.

name: vault-auth-method-deny-list

on:
  workflow_call:

permissions:
  contents: read

jobs:
  vault-auth-method-deny-list:
    name: vault-auth-method-deny-list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller

      # Selftest and scan both live in the action, which carries the scanner
      # and the deny-list with it. This replaced an actions/checkout of
      # zeroroot-ai/.github: GITHUB_TOKEN cannot read a second private repo,
      # so that checkout failed "Repository not found" on every call once the
      # org went private. The runner fetches an action's repo itself.
      - name: Scan for ADR-0009 deny-list violations
        uses: zeroroot-ai/.github/actions/vault-auth-deny-list@main
        with:
          repo-root: ${{ github.workspace }}/caller
          allowlist: ${{ github.workspace }}/caller/.github/.vault-auth-deny-list-allowlist.json
