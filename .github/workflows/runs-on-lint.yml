# Reusable workflow that rejects any `runs-on:` label that is not a
# sanctioned GitHub-hosted runner or the org's ephemeral ARC scale-set.
#
# Epic: cicd-efficiency (board #44) / zeroroot-ai/deploy#1067 / ADR-0060
# ("GitHub-hosted runners are the default for every CI job that does not
# require bare metal; the only jobs allowed off GitHub-hosted are those
# needing /dev/kvm, and those run on ephemeral runner pods in staging that
# are torn down after each job. No persistent self-hosted runners exist.").
#
# Allowed:
#   - ubuntu-* (any GitHub-hosted Ubuntu label: ubuntu-latest, ubuntu-24.04,
#     ubuntu-22.04, the *-cores variants, etc.)
#   - staging-ephemeral (the org's ARC gha-runner-scale-set label —
#     zeroroot-ai/gitops envs/staging/arc-runners.yaml)
#
# Rejected: everything else, including any `self-hosted` array form
# (`runs-on: [self-hosted, <label>]`) and any other custom label. There is
# no allowance for windows-*/macos-* or other GitHub-hosted families — add
# them here explicitly if a real need arises; do not silently widen the
# allowlist in a calling repo.
#
# Called by via:
#   uses: zeroroot-ai/.github/.github/workflows/runs-on-lint.yml@main
#
# Required check name: runs-on-lint (declared in the calling workflow's job
# id — see rulesets/org/tier-core.json / tier-opensource.json).

name: runs-on-lint

on:
  workflow_call:

jobs:
  runs-on-lint:
    name: runs-on-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The CALLER's tree — this is what gets scanned.
      - uses: actions/checkout@v6.0.2 # pin: de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # This repo's own tree, for the scanner + its self-test.
      #
      # A reusable workflow's `actions/checkout` checks out the CALLER, so
      # scripts/ living here are NOT on disk by default — moving the classifier
      # out of an inline `run:` block without this step fails with
      # "scripts/test-runs-on-lint.sh: No such file or directory" (exit 127).
      #
      # Pinned to github.job_workflow_sha — the sha of THIS reusable workflow
      # as the caller resolved it. NOT github.workflow_sha, which is the
      # CALLER's workflow sha: checking this repo out at that ref fails with
      # `upload-pack: not our ref` because the sha belongs to a different
      # repository (observed on zeroroot-ai/gitops#544). NOT `main` either —
      # that would silently decouple the scanner from the caller's pin and
      # defeat the point of pinning.
      - uses: actions/checkout@v6.0.2 # pin: de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: zeroroot-ai/.github
          ref: ${{ github.job_workflow_sha }}
          path: .runs-on-lint

      - name: The scanner checkout resolved
        # An empty workflow_sha would make the step above check out the default
        # branch, quietly undoing the pin. Fail loudly instead.
        run: |
          set -euo pipefail
          [ -n "${{ github.job_workflow_sha }}" ] || {
            echo "::error::github.job_workflow_sha is empty — the scanner checkout would silently fall back to the default branch and defeat the caller's pin."; exit 1; }
          test -x .runs-on-lint/scripts/runs-on-lint-scan.sh
          test -x .runs-on-lint/scripts/test-runs-on-lint.sh

      - name: Self-test the classifier (gates the scan)
        # A guard change without a test is how a guard quietly stops guarding.
        # Exercises the REAL classifier, not a copy.
        run: bash .runs-on-lint/scripts/test-runs-on-lint.sh

      - name: Reject non-sanctioned runs-on labels
        # Scans the CALLER's tree (.), using THIS repo's scanner.
        run: bash .runs-on-lint/scripts/runs-on-lint-scan.sh .
