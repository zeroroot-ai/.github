name: Reusable Go CI (tiered)

# Canonical three-tier Go CI for every Go repo in the workspace.
# Epic: cicd-efficiency (board #44), slice S2 (gibson#1128). See
# docs/architecture/CICD-CONTEXT.md and docs/adr/0060-*.
#
# ONE reusable, called with a `tier` that maps to the caller's trigger:
#
#   pull_request  -> tier: fast   (quick contributor signal; no images, no race)
#   merge_group   -> tier: heavy  (authoritative gate; race + coverage + govulncheck)
#
# The old all-in-one reusable-go-check ran every step on every call; splitting
# by tier is what removes the per-push redundancy that dominated the bill.
#
# Callers pin a RELEASE TAG, never @main (ADR-0060 blast-radius):
#   uses: zeroroot-ai/.github/.github/workflows/reusable-go-ci.yml@v2
#
# Private zeroroot-ai modules: set private-modules: true and pass the
# `gh-pat` secret (a read-only PAT with repo scope) so `go mod download`
# can reach private deps. Public repos (sdk/adk/setec/gibson-executor)
# leave private-modules at its default false and pass no secret.

on:
  workflow_call:
    inputs:
      tier:
        description: "fast (pull_request) | heavy (merge_group)"
        type: string
        required: true
      go-mod-path:
        description: "Path to the module root (default: repo root)"
        type: string
        required: false
        default: ""
      build-tags:
        description: "Comma-separated build tags for build/test (e.g. setec_integration)"
        type: string
        required: false
        default: ""
      golangci-config:
        description: "Path to .golangci.yml (default: auto-discover)"
        type: string
        required: false
        default: ""
      skip-lint:
        description: "Skip golangci-lint (repos not yet on the shared lint baseline)"
        type: boolean
        required: false
        default: false
      private-modules:
        description: "Configure git+GOPRIVATE for private zeroroot-ai modules"
        type: boolean
        required: false
        default: false
      vuln-severity:
        description: "Minimum severity to fail govulncheck (heavy tier only)"
        type: string
        required: false
        default: "MEDIUM"
      vuln-allowlist:
        description: >
          Path, relative to go-mod-path, of a govulncheck allowlist file. When
          empty (the default) govulncheck runs exactly as before and ANY finding
          fails the build. When set, listed advisories are tolerated until their
          stated expiry — see the caller's file for the format. An entry that has
          expired, or that no longer matches a real finding, FAILS the build:
          an exemption that outlives its reason is worse than none, because it
          reads as reviewed.
        type: string
        required: false
        default: ""
    secrets:
      gh-pat:
        description: "Read-only PAT for private module fetch (required when private-modules: true)"
        required: false

permissions:
  contents: read

jobs:
  go-ci:
    name: go-ci (${{ inputs.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.tier == 'heavy' && 30 || 15 }}
    env:
      # Build tags flow to both build and test so the fast compile-check and the
      # heavy race run exercise the same variant the images ship.
      GOFLAGS: ${{ inputs.build-tags != '' && format('-tags={0}', inputs.build-tags) || '' }}
    steps:
      - uses: actions/checkout@v6.0.2 # pin: de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Private-module auth MUST be configured before setup-go (which may run
      # `go mod download`). GOPRIVATE skips the public proxy/checksum DB.
      - name: Configure private module access
        if: ${{ inputs.private-modules }}
        env:
          GH_PAT: ${{ secrets.gh-pat }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::private-modules: true but the gh-pat secret is empty"; exit 1
          fi
          echo "GOPRIVATE=github.com/zeroroot-ai/*" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@v6.4.0 # pin: 4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: ${{ inputs.go-mod-path != '' && format('{0}/go.mod', inputs.go-mod-path) || 'go.mod' }}
          cache: true

      # ---- FAST tier (pull_request): quick signal, no race, no images ----
      - name: go mod tidy + drift check
        if: ${{ inputs.tier == 'fast' }}
        run: |
          set -euo pipefail
          cd "${{ inputs.go-mod-path }}" 2>/dev/null || true
          go mod tidy
          git diff --exit-code go.mod
          test ! -f go.sum || git diff --exit-code go.sum

      - name: go vet
        if: ${{ inputs.tier == 'fast' }}
        run: |
          cd "${{ inputs.go-mod-path }}" 2>/dev/null || true
          go vet ./...

      - name: golangci-lint
        if: ${{ inputs.tier == 'fast' && ! inputs.skip-lint }}
        uses: golangci/golangci-lint-action@v6.5.2 # pin: 55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v2.0.2
          working-directory: ${{ inputs.go-mod-path }}
          args: --timeout=10m

      - name: go build (compile-check)
        if: ${{ inputs.tier == 'fast' }}
        run: |
          cd "${{ inputs.go-mod-path }}" 2>/dev/null || true
          go build ./...

      - name: go test (unit, no race)
        if: ${{ inputs.tier == 'fast' }}
        run: |
          cd "${{ inputs.go-mod-path }}" 2>/dev/null || true
          go test ./...

      # ---- HEAVY tier (merge_group): authoritative gate before landing ----
      - name: go test (race)
        if: ${{ inputs.tier == 'heavy' }}
        run: |
          cd "${{ inputs.go-mod-path }}" 2>/dev/null || true
          go test -race ./...

      - name: govulncheck
        if: ${{ inputs.tier == 'heavy' && inputs.vuln-allowlist == '' }}
        run: |
          set -euo pipefail
          cd "${{ inputs.go-mod-path }}" 2>/dev/null || true
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      # Same scan, but findings are checked against the caller's allowlist. Kept
      # as a separate step rather than a branch inside the one above so the
      # default path is byte-identical to what every other caller runs today.
      - name: govulncheck (allowlisted)
        if: ${{ inputs.tier == 'heavy' && inputs.vuln-allowlist != '' }}
        env:
          VULN_ALLOWLIST: ${{ inputs.vuln-allowlist }}
        run: |
          set -euo pipefail
          cd "${{ inputs.go-mod-path }}" 2>/dev/null || true
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck -format json ./... > /tmp/govulncheck.json || true
          python3 - "$VULN_ALLOWLIST" /tmp/govulncheck.json <<'PYCHECK'
          import datetime
          import json
          import pathlib
          import sys

          allowlist_path, report_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])

          if not allowlist_path.is_file():
              sys.exit(f"FAIL: vuln-allowlist {allowlist_path} does not exist")

          # Deliberately not PyYAML: the runner may not have it, and a parser
          # this file's shape does not need is a dependency that can break the
          # gate for a reason unrelated to security.
          entries = {}
          current = None
          for raw in allowlist_path.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("- id:"):
                  current = line.split(":", 1)[1].strip().strip('"')
                  entries[current] = {}
              elif current and ":" in line:
                  k, v = line.split(":", 1)
                  entries[current][k.strip()] = v.strip().strip('"')

          if not entries:
              sys.exit(f"FAIL: parsed zero entries from {allowlist_path} — the file shape changed. "
                       "Refusing to run, because an empty parse would silently tolerate every finding.")

          findings = set()
          for raw in report_path.read_text().splitlines():
              raw = raw.strip()
              if not raw.startswith("{"):
                  continue
              try:
                  msg = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              f = msg.get("finding")
              # Symbol-level only: a trace entry with a function is code that is
              # actually reachable, which is what "your code is affected" means.
              if f and any(fr.get("function") for fr in (f.get("trace") or [])):
                  findings.add(f["osv"])

          today = datetime.date.today()
          problems = []

          for osv in sorted(findings - set(entries)):
              problems.append(f"  {osv}: reachable and NOT allowlisted")

          for osv, meta in sorted(entries.items()):
              expires = meta.get("expires", "")
              if not expires:
                  problems.append(f"  {osv}: allowlist entry has no expires date")
                  continue
              try:
                  when = datetime.date.fromisoformat(expires)
              except ValueError:
                  problems.append(f"  {osv}: expires {expires!r} is not YYYY-MM-DD")
                  continue
              if when < today:
                  problems.append(f"  {osv}: EXPIRED on {expires} — re-review it or fix the vulnerability")
              elif osv not in findings:
                  # The verify-chart-signature.sh rule: a stale exemption is a
                  # failure, so the debt cannot outlive itself.
                  problems.append(f"  {osv}: no longer reachable — delete this allowlist entry")

          if problems:
              print("FAIL: govulncheck allowlist check", file=sys.stderr)
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)

          print(f"OK — {len(findings)} reachable advisory(ies), all allowlisted and unexpired:")
          for osv in sorted(findings):
              print(f"  {osv}  expires {entries[osv]['expires']}  {entries[osv].get('reason', '')}")
          PYCHECK
