# Reusable workflow: validates PR titles against Conventional Commits format
# with the org-wide lowercase-first subject rule.
#
# Called by per-repo workflows via:
#   uses: zeroroot-ai/.github/.github/workflows/pr-title-lint.yml@main
#
# Required check name: pr-title-lint (declared in the calling workflow's job id).
#
# Rules enforced:
#   - Type must be one of: feat fix chore docs refactor test perf build ci revert
#   - Optional scope: feat(scope): ...
#   - Subject must NOT start with an uppercase character (org-wide lowercase rule)
#     ref: CLAUDE.md "deploy PR-title lint" memory entry
#   - Breaking-change footer or ! suffix is allowed (feat!:, fix!:, etc.)

name: pr-title-lint

on:
  workflow_call:

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-title-lint:
    name: pr-title-lint
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the conventional commits subject pattern. Please ensure
            the subject does not start with an uppercase character.
      # The body must not close an issue with the bare `repo#N` form, which
      # GitHub ignores (.github#306, deploy ADR-0012): the PR merges and the
      # issue stays open. The check proves it can fail first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: zeroroot-ai/.github
          ref: main
          path: org-dot-github
      - name: PR body closes issues in a form GitHub honours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash org-dot-github/scripts/check-pr-body-closer.sh --selftest
          gh pr view "$PR_NUMBER" --repo "$PR_REPO" --json body --jq .body > "$RUNNER_TEMP/pr-body.txt"
          bash org-dot-github/scripts/check-pr-body-closer.sh "$RUNNER_TEMP/pr-body.txt"
