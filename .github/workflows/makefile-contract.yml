name: makefile-contract

# Slice 1.4 of the production-readiness epic (gibson#171 → board #16).
# Asserts every repo's Makefile exposes the contracted targets:
#
#   build / test / check
#
# The audit lives in scripts/check-makefile-contract.sh and is fixture- and
# regression-tested by scripts/test-makefile-contract.sh, which gates every
# run. It used to live inline here, where it read
# `echo "$MAKEFILE" | grep -qE "^${T}:"`. grep -q exits on its first match and
# the writer dies of SIGPIPE; under `set -o pipefail` the guard could not tell
# that apart from "no match", so the org's largest Makefile was reported as
# missing two targets it defines (.github#141). The audit now greps the file
# directly, and the self-test keeps the pipeline from coming back.
#
# Exempt repos (no Go service or library, so the contract does not apply):
# charts and hosted (Helm + Terraform), the pnpm/TypeScript repos (dashboard,
# sdk-ts, zerocool-plugins — their contract is package.json scripts, and a stub
# Makefile wrapping pnpm would be a second entrypoint that drifts), the org
# repo, and the pages site.
#
# Token scope: enumeration uses GH_PAT_PLATFORM_RO so the audit can see
# PRIVATE org repos. With the default GITHUB_TOKEN `gh api orgs/.../repos`
# returns only PUBLIC repos, so the audit silently skips every private repo
# and reports a false "all clear" (.github#170). The script hard-fails if the
# private canary is not visible, so the blind spot cannot silently return.
#
# Runs monthly + on workflow_dispatch + on PR touching the audit (to validate
# changes against the fixtures). Cadence pruned weekly→monthly by .github#201
# (cicd-efficiency epic, board #44).

on:
  schedule:
    - cron: "30 11 1 * *"  # monthly: 1st of month, 11:30 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/makefile-contract.yml"
      - "scripts/check-makefile-contract.sh"
      - "scripts/test-makefile-contract.sh"
      - "tests/fixtures/makefile-contract/**"

permissions:
  contents: read

jobs:
  fixture-self-test:
    # Proves the audit names a genuinely missing target, stays quiet about a
    # present one, skips the exempt repos, and — the .github#141 case — passes
    # a complete Makefile that is far larger than a pipe buffer. Gates the
    # audit on every scheduled run, so a regression fails before anything is
    # filed.
    name: contract-logic-fixture-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run fixture + regression tests
        run: bash scripts/test-makefile-contract.sh

  audit:
    name: audit
    if: github.event_name != 'pull_request'
    needs: fixture-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit each repo's Makefile contract
        env:
          # PLATFORM_RO PAT enumerates PRIVATE repos; GITHUB_TOKEN sees only
          # public ones and would make this audit silently incomplete.
          GH_TOKEN: ${{ secrets.GH_PAT_PLATFORM_RO || secrets.GITHUB_TOKEN }}
        run: bash scripts/check-makefile-contract.sh
