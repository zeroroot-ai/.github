# Reusable workflow: every workflow file in the calling repository is a valid
# workflow, checked with actionlint before it merges.
#
# WHY THIS EXISTS
#
# A workflow can be valid YAML and an invalid workflow, and nothing rejects it
# when it is written, reviewed or merged. Measured cases in this org:
#
#   * setec e2e.yml read `steps.kata.outputs.version` after the step was renamed
#     to `pins`. A reference to a step that does not exist is not an error to
#     GitHub. It is an empty string. The nightly e2e suites failed three nights
#     on "KATA_VERSION is empty" (setec#147).
#   * charts exit-test-published-install.yml used the `runner` context at job
#     level. Two runs failed at dispatch with zero jobs and no log to open.
#
# charts and hosted each carry a copy of scripts/check-workflows.sh for this.
# A third copy in setec would be the same mistake. This is the one place.
#
# WHAT IT CHECKS
#
# actionlint's own rules: expressions, contexts, step and job references,
# matrix keys, `needs`, inputs and secrets of reusable workflows, event
# filters. shellcheck and pyflakes are switched off. They report style in
# `run:` blocks, which is a different question with hundreds of answers, and a
# gate that starts red in every repository gets switched off.
#
# A second step fails any workflow that has a `schedule` trigger. Owner order
# 2026-10-19: no zeroroot-ai repo runs a scheduled workflow. A workflow that
# must run on a timer is started by a person with `workflow_dispatch`.
#
# A third step fails a job that starts kind with no raise-inotify-limits step
# before it (gibson#1331). See the step for what counts as a kind start.
#
# The one runner label that is not GitHub-hosted is the org's ephemeral ARC
# scale-set (`*-ephemeral`, enforced by runs-on-lint.yml), so it is
# declared here once and no consumer needs a config file.
#
# Called by per-repo workflows via:
#   uses: zeroroot-ai/.github/.github/workflows/workflow-lint.yml@<sha> # vX.Y.Z
#
# Required check name: workflow-lint

name: workflow-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The CALLER's tree. This is what gets linted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint every workflow file
        # DELIBERATELY INLINE, for the reason runs-on-lint.yml gives: a reusable
        # workflow's checkout fetches the caller, so this repo's scripts/ are
        # not on disk here. Inline, the logic travels with the pinned sha.
        # scripts/test-workflow-lint.sh extracts the two blocks below out of
        # this file and runs them against failing fixtures, so the tested thing
        # and the shipped thing are the same bytes.
        #
        # No GitHub expression may appear inside this run: block, not even in a
        # comment. Actions interpolates it there and the whole file is invalid.
        run: |
          set -euo pipefail
          # BEGIN-INSTALL (extracted by scripts/test-workflow-lint.sh)
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          tools="${RUNNER_TEMP}/workflow-lint"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tools/actionlint.tar.gz" | sha256sum -c - >/dev/null
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          printf '%s\n' 'self-hosted-runner:' '  labels:' '    - "*-ephemeral"' > "$tools/actionlint.yaml"
          # END-INSTALL
          # BEGIN-LINT (extracted by scripts/test-workflow-lint.sh)
          count="$(find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::error::no workflow file under .github/workflows, so this run linted nothing"
            exit 1
          fi
          if ! "$tools/actionlint" -config-file "$tools/actionlint.yaml" -shellcheck= -pyflakes=; then
            echo "::error::a workflow file is not a valid workflow. GitHub does not reject these when they merge: it fails the run later, or evaluates the bad reference to an empty string."
            exit 1
          fi
          echo "OK: $count workflow file(s) are valid workflows."
          # END-LINT

      - name: No workflow has a schedule trigger
        # INLINE for the same reason as the step above.
        # scripts/test-workflow-lint.sh extracts the program below and runs it
        # against a workflow that has a schedule, which must fail.
        #
        # No GitHub expression may appear inside this run: block, not even in a
        # comment. Actions interpolates it there and the whole file is invalid.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # BEGIN-NOSCHED (extracted by scripts/test-workflow-lint.sh)
          import glob, sys
          import yaml

          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          failures = []
          for path in files:
              with open(path, encoding="utf-8") as fh:
                  doc = yaml.safe_load(fh)
              if not isinstance(doc, dict):
                  failures.append("%s: not a workflow mapping, so its triggers were not checked" % path)
                  continue
              # PyYAML reads a bare `on:` key as the boolean True. A file can hold
              # both a quoted "on" and a bare on key, so check both.
              if "on" in doc and True in doc:
                  failures.append("%s: has both a quoted and a bare on key" % path)
                  continue
              on = doc.get("on", doc.get(True))
              if isinstance(on, dict):
                  names = set(on)
              elif isinstance(on, list):
                  names = set(on)
              elif isinstance(on, str):
                  names = {on}
              else:
                  failures.append("%s: no readable `on:` block, so its triggers were not checked" % path)
                  continue
              if "schedule" in names:
                  failures.append("%s: has a `schedule` trigger. No workflow runs on a schedule. Remove it and use workflow_dispatch" % path)
          if not files:
              failures.append("no workflow file under .github/workflows, so this run checked nothing")
          for f in failures:
              print("::error::" + f)
          if failures:
              sys.exit(1)
          print("OK: %d workflow file(s) have no schedule trigger." % len(files))
          # END-NOSCHED
          PY

      - name: A job that starts kind raises the inotify limits first
        # INLINE for the same reason as the steps above.
        # scripts/test-workflow-lint.sh extracts the program below and runs it
        # against fixture workflows: each way to start kind with no raise
        # before it must fail, and the raised and install-only forms must pass.
        #
        # No GitHub expression may appear inside this run: block, not even in a
        # comment. Actions interpolates it there and the whole file is invalid.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # BEGIN-KIND (extracted by scripts/test-workflow-lint.sh)
          # A kind cluster on a GitHub-hosted runner hits the default inotify
          # limits, and the kubelet loses pod logs ("failed to create fsnotify
          # watcher: too many open files", gibson#1331). Each job that starts
          # kind runs the raise-inotify-limits action in an earlier step.
          #
          # A kind start is any of: `make recreate`, `make substrate ENV=kind`,
          # `kind create cluster` in a run: line, or helm/kind-action without
          # install_only true. A step that uses a composite action of this repo
          # (./.github/actions/<name>) is read through that action. Comment
          # lines do not count. A start inside a script that a run: line calls
          # is not visible here; that script's workflow step names it instead.
          import glob, os, re, sys
          import yaml

          RAISE = re.compile(r"(^|/)\.github/actions/raise-inotify-limits/?$")
          STARTS = [
              (re.compile(r"\bmake\b[^\n#]*\brecreate\b"), "make recreate"),
              (re.compile(r"\bmake\b[^\n#]*\bsubstrate\b[^\n#]*\bENV=\"?kind\b|\bENV=\"?kind\"?\s+make\b[^\n#]*\bsubstrate\b"), "make substrate ENV=kind"),
              (re.compile(r"\bkind\s+create\s+cluster\b"), "kind create cluster"),
          ]

          def code_lines(text):
              return "\n".join(l for l in str(text or "").splitlines() if not l.lstrip().startswith("#"))

          def local_action(uses):
              if not uses.startswith("./"):
                  return None
              base = uses[2:].rstrip("/")
              for name in ("action.yml", "action.yaml"):
                  path = os.path.join(base, name)
                  if os.path.isfile(path):
                      return path
              return None

          def kind_start(step):
              """The way this one step starts kind, or None."""
              uses = str(step.get("uses") or "")
              if uses.split("@")[0].endswith("helm/kind-action"):
                  w = step.get("with") or {}
                  if str(w.get("install_only", "")).lower() != "true":
                      return "helm/kind-action without install_only"
                  return None
              run = code_lines(step.get("run"))
              # This step's own program names every kind start in its patterns
              # and labels. It starts no cluster, so it is not read as one.
              if "BEGIN-" + "KIND (extracted by" in str(step.get("run") or ""):
                  return None
              for rx, label in STARTS:
                  if rx.search(run):
                      return label
              return None

          def walk(steps, raised, where, failures, depth=0):
              """Walk the steps in order. Returns whether the limits are raised after them."""
              for i, step in enumerate(steps or []):
                  if not isinstance(step, dict):
                      continue
                  uses = str(step.get("uses") or "")
                  label = "%s step %d (%s)" % (where, i + 1, step.get("name") or uses or "run")
                  if RAISE.search(uses.split("@")[0]):
                      raised = True
                      continue
                  start = kind_start(step)
                  if start and not raised:
                      failures.append("%s starts kind (%s) with no raise-inotify-limits step before it. "
                                      "Add `uses: zeroroot-ai/.github/.github/actions/raise-inotify-limits@<sha>` "
                                      "as an earlier step of the job" % (label, start))
                  path = local_action(uses)
                  if path and depth < 5:
                      with open(path, encoding="utf-8") as fh:
                          act = yaml.safe_load(fh) or {}
                      inner = ((act.get("runs") or {}).get("steps")) or []
                      raised = walk(inner, raised, "%s -> %s" % (label, path), failures, depth + 1)
              return raised

          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          failures = []
          for path in files:
              with open(path, encoding="utf-8") as fh:
                  doc = yaml.safe_load(fh)
              if not isinstance(doc, dict):
                  continue
              for job_id, job in (doc.get("jobs") or {}).items():
                  if isinstance(job, dict):
                      walk(job.get("steps"), False, "%s job %s" % (path, job_id), failures)
          if not files:
              failures.append("no workflow file under .github/workflows, so this run checked nothing")
          for f in failures:
              print("::error::" + f)
          if failures:
              sys.exit(1)
          print("OK: %d workflow file(s): every job that starts kind raises the inotify limits first." % len(files))
          # END-KIND
          PY
