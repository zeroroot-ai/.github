# Reusable workflow: the ADR citation guard of the organization.
#
# A code comment cites an architecture decision record as `ADR-NNNN`. The
# records are private. One public index lists each live number with its rule,
# and each retired number. The source copy is `docs/adr-index.md` in
# zeroroot-ai/gibson, and each other repo keeps a copy at the same path.
#
# This workflow reads the copy in the calling repository and fails on a
# citation of a number that is retired or is not in the index. It never
# fetches the index (ADR-0068, ADR-0094, gibson#740).
#
# The rules, the exemptions and the self-test are in
# actions/adr-citations/check-adr-citations.py. Read that file for the
# contract.
#
# Called from the tree-guards workflow of each repo:
#   uses: zeroroot-ai/.github/.github/workflows/adr-citations.yml@<sha> # vX.Y.Z
#
# Required check name: adr-citations
#
# Exemptions of one repo: the file `.adr-citations-allow` at its root. Each
# entry is a repo-relative path under a `# why:` comment. An entry that
# exempts no finding fails the run.

name: adr-citations

on:
  workflow_call:
    inputs:
      index:
        description: "Path of the ADR index in the calling repository"
        type: string
        required: false
        default: docs/adr-index.md

permissions:
  contents: read

jobs:
  adr-citations:
    name: adr-citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller

      # An action, not a checkout of zeroroot-ai/.github. actions/brand-guard
      # states the reason.
      - name: Check each ADR citation against the index
        uses: zeroroot-ai/.github/actions/adr-citations@2267cc2e13bd2afeaa7b8bda466318c5079282d9 # v0.15.0
        with:
          repo-root: ${{ github.workspace }}/caller
          index: ${{ inputs.index }}
