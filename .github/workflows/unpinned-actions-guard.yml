# Org-wide guard: every remote GitHub Action and reusable workflow in every
# repository is pinned to a commit SHA (attic#24, .github#66). A moved ref
# cannot change what CI runs.
#
# Runs nightly and on demand. Clones each repository shallowly with the org
# read token, then runs scripts/pin-actions.py --check on its .github tree.
#
# FIRST-PARTY REFERENCES COUNT (.github#66). This used to exempt
# zeroroot-ai/* on the grounds that they were "re-pinned by the consumers'
# own workflows". Nothing did: templates/tree-guards.yml shipped `@main` and
# 19 repositories copied it, which is where 24 of the org's open code-scanning
# alerts came from. The trust boundary is not the owner, it is whether the ref
# can move.
#
# The selftest job proves the guard can fail on BOTH scopes:
#   tests/fixtures/unpinned-actions      one unpinned third-party action
#   tests/fixtures/unpinned-firstparty   third-party pinned, first-party @main
#   tests/fixtures/unpinned-composite    a composite action whose own step is unpinned
# and .github's own tree must pass.
name: unpinned-actions-guard
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/unpinned-actions-guard.yml"
      - "scripts/pin-actions.py"
      - "tests/fixtures/unpinned-actions/**"
      - "tests/fixtures/unpinned-firstparty/**"
      - "tests/fixtures/unpinned-composite/**"
permissions:
  contents: read
jobs:
  selftest:
    name: unpinned-actions-guard selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the fixture with an unpinned third-party action must fail
        run: |
          set -uo pipefail
          if python3 scripts/pin-actions.py tests/fixtures/unpinned-actions --check; then
            echo "::error::guard accepted an unpinned action"; exit 1
          fi
          echo "PASS: unpinned third-party fixture rejected"
      - name: the fixture with an unpinned FIRST-PARTY reusable must fail
        run: |
          set -uo pipefail
          if python3 scripts/pin-actions.py tests/fixtures/unpinned-firstparty --check; then
            echo "::error::guard accepted an unpinned first-party reusable workflow"; exit 1
          fi
          echo "PASS: unpinned first-party fixture rejected"
      - name: the fixture with an unpinned dependency INSIDE A COMPOSITE ACTION must fail
        # The one unpinned reference the org actually shipped lived in
        # actions/flake-quarantine/action.yml, not in a workflow. It went
        # unseen because this repo was exempt from the org job below.
        run: |
          set -uo pipefail
          if python3 scripts/pin-actions.py tests/fixtures/unpinned-composite --check; then
            echo "::error::guard accepted an unpinned dependency inside a composite action"; exit 1
          fi
          echo "PASS: unpinned composite-action fixture rejected"
      - name: this repository must pass
        run: python3 scripts/pin-actions.py . --check
  org:
    name: every repository is pinned
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GH_PAT_PLATFORM_RO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check each repository
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT_PLATFORM_RO is empty"; exit 1; }
          failures=0
          for repo in $(gh repo list zeroroot-ai --limit 200 --no-archived --json name --jq '.[].name'); do
            # .github is NOT skipped. It was, and the one unpinned reference in
            # the whole org — actions/upload-artifact@v7.0.1 inside
            # actions/flake-quarantine/action.yml — lived here, in a composite
            # action, reachable from every consumer through its release pin.
            # It surfaced only when sha_pinning_required went on and setec's
            # merge-queue run died at Set up job. pin-actions.py walks every
            # *.y*ml in a checkout, so composite actions are covered as long as
            # the repo that holds them is not exempt.
            rm -rf /tmp/r
            if ! gh repo clone "zeroroot-ai/$repo" /tmp/r -- --depth 1 --quiet 2>/dev/null; then
              echo "::warning::could not clone $repo"; continue
            fi
            [ -d /tmp/r/.github ] || continue
            echo "::group::$repo"
            if ! python3 scripts/pin-actions.py /tmp/r --check; then failures=$((failures+1)); fi
            echo "::endgroup::"
          done
          [ "$failures" -eq 0 ] || { echo "::error::$failures repositor(y/ies) carry an unpinned action or reusable workflow"; exit 1; }
