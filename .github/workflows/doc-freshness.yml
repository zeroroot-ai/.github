name: doc-freshness

# Two documentation checks that run on every PR against this repository:
#
#   - every Markdown link resolves (lychee, across all .md files)
#   - CLAUDE.md and AGENTS.md name no file that has been removed or renamed
#
# The `// adr: N` and `// trap: T<NNNN>` reference resolution used to run here
# too. It read the ADR and trap catalogs over the API from the internal docs
# repository. That repository was deleted on 2026-09-05 and both catalogs now
# live only in the local workspace, so no CI runner can resolve either
# reference. The two jobs and their fixture self-test are deleted rather than
# skipped, because a disabled dead path reads as coverage that is not there.
#
# The `workflow_call` trigger and the docs-repo read token went with them: no
# repository ever called this workflow, and the token existed only to read the
# private docs repository.

on:
  pull_request:

permissions:
  contents: read

jobs:
  lychee:
    name: broken-link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --exclude-loopback
            --exclude '^mailto:'
            --exclude '^localhost'
            --exclude 'example\.(com|org)'
            --exclude 'img\.shields\.io'
            --exclude 'discord\.gg'
            --exclude 'docs\.zeroroot\.ai'
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  claude-md-drift:
    name: CLAUDE.md drift (stale paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect stale file/workflow refs in CLAUDE.md
        run: |
          set -uo pipefail
          # CLAUDE.md / AGENTS.md may reference repo-relative paths.
          # Quick check: every path-shaped string (e.g. internal/foo, .github/workflows/X.yml)
          # mentioned in CLAUDE.md must exist OR be a known external URL.
          for FILE in CLAUDE.md AGENTS.md; do
            [ -f "$FILE" ] || continue
            BAD=0
            while IFS= read -r REF; do
              # Strip the surrounding markdown syntax
              REF=$(echo "$REF" | grep -oE '[a-zA-Z][a-zA-Z0-9/_.-]+/[a-zA-Z0-9/_.-]+' | head -1)
              [ -z "$REF" ] && continue
              # Skip URLs + skip globs + skip code-fence words
              echo "$REF" | grep -qE '^(https?:|github\.com|orgs/)' && continue
              # Skip if it's a 'package/name' fragment that doesn't look like a path
              echo "$REF" | grep -qE '\.(go|ts|tsx|yml|yaml|md|json|sh|toml)$|/$' || continue
              if [ ! -e "$REF" ]; then
                echo "::warning file=$FILE::stale-looking path reference: $REF"
                # Warning, not error: many references are workspace-relative
                # or canonical (the workspace root is not a git repo) — too
                # noisy to fail on. The signal here is human-review-grade.
              fi
            done < <(grep -oE '\`[^\`]+\`' "$FILE" 2>/dev/null)
          done
